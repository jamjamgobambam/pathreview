version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pathreview
      POSTGRES_PASSWORD: pathreview
      POSTGRES_DB: pathreview_dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathreview"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  vector-db:
    image: chromadb/chroma:1.5.9
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/data
    environment:
      ANONYMIZED_TELEMETRY: "false"
    # NOTE: chromadb/chroma:1.5.9 is a minimal image with no curl/wget/python,
    # so no in-container healthcheck is possible. Verify from the host with:
    #   curl http://localhost:8001/api/v2/heartbeat
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  pgdata:
  chromadata:
