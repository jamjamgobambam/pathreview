name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff black
      - name: Ruff lint
        run: ruff check .
      - name: Black format check
        run: black --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Mypy type check
        run: mypy api/ core/ ingestion/ rag/ agent/ safety/ --ignore-missing-imports

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit -v --tb=short
        env:
          LLM_PROVIDER: mock

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pathreview
          POSTGRES_PASSWORD: pathreview
          POSTGRES_DB: pathreview_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pathreview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run integration tests
        run: pytest tests/integration -v --tb=short
        env:
          DATABASE_URL: postgresql://pathreview:pathreview@localhost:5432/pathreview_test
          REDIS_URL: redis://localhost:6379/0
          LLM_PROVIDER: mock

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Frontend lint and tests
        run: cd frontend && npm test -- --run

  # NEW JOB — added for issue #128
  #
  # IMPORTANT: pip-audit's JSON output in the version resolved by this
  # project (2.10.1) has NO `severity` field on its findings — confirmed
  # directly against this repo's real output on 2026-07-19 (see PLAN.md).
  # Severity-threshold filtering is therefore not possible for the Python
  # side. Policy adopted instead: fail on ANY finding, except vulnerability
  # IDs explicitly accepted below with a documented reason.
  #
  # Currently accepted (ignored):
  #   - PYSEC-2026-1325 (ecdsa / CVE-2024-23342): Minerva timing attack.
  #     No fix exists; ecdsa's maintainers have stated side-channel attacks
  #     are out of scope for the project and there is no planned fix.
  #
  # NOT ignored, and expected to fail this check on first run:
  #   - PYSEC-2026-311 (chromadb / CVE-2026-45829): pre-auth code injection
  #     (RCE) via a malicious model repo + trust_remote_code=true. No fix
  #     version currently exists. This is a real, serious, unresolved
  #     vulnerability in a direct dependency — remediating it is out of
  #     scope for issue #128 (which asks only for the scanning capability),
  #     but it should NOT be silently ignored here. Flagged in the PR
  #     description as a separate, higher-priority follow-up.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" pip-audit
      - name: Python dependency audit
        run: pip-audit . --ignore-vuln PYSEC-2026-1325
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: Node dependency audit (fail on high/critical severity)
        run: cd frontend && npm audit --audit-level=high
